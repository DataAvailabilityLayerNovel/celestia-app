syntax = "proto3";
package celestia.core.v1.proof;

option go_package = "github.com/celestiaorg/celestia-app/pkg/proof";

// ShareProof is a KZG polynomial commitment proof that a set of shares exist
// in specific columns of the data square and a commitment proof that those
// column commitments belong to the data root.
message ShareProof {
  // data contains the raw shares being proven (original data square shares)
  repeated bytes data = 1;
  // share_proofs contains KZG multi-proofs, one for each affected column
  // Each proof verifies that the shares in that column satisfy the polynomial
  // commitment via KZG pairing verification
  repeated KZGMultiProof share_proofs = 2;
  // namespace_id is the namespace identifier for these shares
  bytes namespace_id = 3;
  // commitment_proof proves that the column commitments belong to the data root
  CommitmentProof commitment_proof = 4;
  // namespace_version is the version of the namespace
  uint32 namespace_version = 5;
}

// KZGMultiProof is a KZG proof for a range of shares in a column
// It proves that specific shares belong to the polynomial represented by
// a column commitment via the KZG polynomial commitment scheme
message KZGMultiProof {
  // proof is the commitments to the quotient polynomial Q(x) as a single G1 point
  // Serialized in compressed form (48 bytes for BN254)
  bytes proof = 1;
}

// CommitmentProof proves that column commitments belong to the data root
// This replaces the old RowProof's role in proving row/column inclusion to the root
message CommitmentProof {
  // column_proofs contains KZG proofs for each column commitment inclusion
  // These prove that each column commitment satisfies a polynomial relationship
  // with the data root commitment
  repeated KZGMultiProof column_proofs = 1;
  // column_indices contains the indices of columns being proven
  // Used to identify which columns are included in this proof
  repeated uint32 column_indices = 2;
  // root_commitment is the data root as a point commitment (optional, for verification)
  bytes root_commitment = 3;
}